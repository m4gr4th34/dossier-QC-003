name: check-retracted
on:
  push:
  pull_request:
jobs:
  retracted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retracted-claim sentinel (every file, every stage — not gated on release)
        run: python3 verification/check_retracted.py
